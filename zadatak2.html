<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Prijava za studentski pohod na Lukomir</title>
</head>
<body>
  <h1>Prijava za studentski pohod na Lukomir</h1>

  <p>Ova forma služi za prikupljanje podataka od zainteresovanih studenata.</p>

  <h2>Podaci za prijavu</h2>
  <form>
    <label for="ime">Ime:</label><br>
    <input type="text" id="ime" ><br><br>
    <label for="prezime">Prezime:</label><br>
    <input type="text" id="prezime" ><br><br>

    <label for="telefon">Broj telefona:</label><br>
    <input type="text" id="telefon" ><br><br>

    <p>Kako planiraš doći do polazne tačke?</p>
    <input type="radio" id="prevoz-organizovan" >
    <label for="prevoz-organizovan">Organizovani autobus</label><br>
    <input type="radio" id="prevoz-vlastiti" >
    <label for="prevoz-vlastiti">Vlastitim automobilom</label><br>
  

    <p>Šta bi te zanimalo tokom izleta? Možeš označiti više odgovora.</p>
    <input type="checkbox" id="interes-priroda">
    <label for="interes-priroda">Šetnja i priroda</label><br>
    <input type="checkbox" id="interes-fotografija" >
    <label for="interes-fotografija">Fotografisanje</label><br>
    <input type="checkbox" id="interes-kultura" >
    <label for="interes-kultura">Upoznavanje lokalne kulture</label><br>
    <input type="checkbox" id="interes-hrana" >
    <label for="interes-hrana">Probavanje lokalne hrane</label><br><br>
    <label for="napomena">Napomena, npr. nedostatak opreme za cjelodnevni boravak na hladnoći:</label><br>
    <input type="text" id="napomena" ><br><br>
  </form>


</body>
</html>
